<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-label="Two nodes. On node 1 the PLC connection A, the heavy writer, writes k1, k2 and k3 under shared locks on node 1 only, granted at once. On node 2 a user session, the occasional writer, rarely writes k3 under an exclusive lock on every node; its request on node 1 queues behind the shared holder. Only the occasional write crosses the link">
<rect width="760" height="424" fill="#fcfcfb"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Design 4: heavy writers lock shared and local, rare writers lock exclusive on every node</text>
<rect x="24" y="56" width="344" height="346" rx="6" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="36" y="76" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">node 1</text>
<rect x="392" y="56" width="344" height="346" rx="6" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="404" y="76" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">node 2</text>
<rect x="36" y="92" width="200" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="136.0" y="110" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">PLC connection A</text>
<text x="136.0" y="126" font-size="11" fill="#52514e" text-anchor="middle">heavy writer: k1, k2, k3, all the time</text>
<line x1="136" y1="136" x2="136" y2="344" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="144" y="176" font-size="11" fill="#52514e" text-anchor="start">every write:</text>
<text x="144" y="190" font-size="11" fill="#52514e" text-anchor="start">shared lock on k1, k2, k3</text>
<text x="144" y="204" font-size="11" fill="#52514e" text-anchor="start">local, granted at once</text>
<text x="144" y="218" font-size="11" fill="#52514e" text-anchor="start">nothing crosses the link</text>
<rect x="36" y="346" width="320" height="40" rx="4" fill="#f0efec"/>
<text x="38" y="399" font-size="11" fill="#52514e" text-anchor="start">locks on node 1</text>
<rect x="56" y="355" width="28" height="22" rx="3" fill="#e1e0d9"/>
<text x="70" y="370" font-size="11" fill="#0b0b0b" text-anchor="middle">k1</text>
<rect x="96" y="355" width="28" height="22" rx="3" fill="#e1e0d9"/>
<text x="110" y="370" font-size="11" fill="#0b0b0b" text-anchor="middle">k2</text>
<rect x="136" y="355" width="28" height="22" rx="3" fill="#e1e0d9"/>
<text x="150" y="370" font-size="11" fill="#0b0b0b" text-anchor="middle">k3</text>
<rect x="186" y="355" width="28" height="22" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="200" y="370" font-size="11" fill="#0b0b0b" text-anchor="middle">k3</text>
<text x="222" y="370" font-size="11" fill="#52514e" text-anchor="start">queued behind k3</text>
<rect x="540" y="92" width="184" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="632.0" y="110" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">user session</text>
<text x="632.0" y="126" font-size="11" fill="#52514e" text-anchor="middle">occasional writer: k3, rarely</text>
<line x1="632" y1="136" x2="632" y2="344" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="624" y="176" font-size="11" fill="#52514e" text-anchor="end">k3: exclusive,</text>
<text x="624" y="190" font-size="11" fill="#52514e" text-anchor="end">on every node, rarely</text>
<rect x="404" y="346" width="320" height="40" rx="4" fill="#f0efec"/>
<text x="406" y="399" font-size="11" fill="#52514e" text-anchor="start">locks on node 2</text>
<rect x="618" y="355" width="28" height="22" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="632" y="370" font-size="11" fill="#0b0b0b" text-anchor="middle">k3</text>
<line x1="540" y1="114" x2="200" y2="344" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="404" y="262" font-size="11" fill="#52514e" text-anchor="start">k3 on node 1:</text>
<text x="404" y="276" font-size="11" fill="#52514e" text-anchor="start">queues behind the shared holder</text>
<rect x="36" y="406" width="16" height="12" rx="2" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="58" y="416" font-size="11" fill="#52514e" text-anchor="start">exclusive lock</text>
<rect x="150" y="406" width="16" height="12" rx="2" fill="#e1e0d9"/>
<text x="172" y="416" font-size="11" fill="#52514e" text-anchor="start">shared lock</text>
<line x1="260" y1="412" x2="278" y2="412" stroke="#eb6834" stroke-width="1.5"/>
<text x="284" y="416" font-size="11" fill="#52514e" text-anchor="start">crosses the link</text>
</svg>
