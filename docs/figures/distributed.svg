<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-label="Locks per second for one exclusive lock on both nodes per write, with the demand of 200,000 per second marked. At 10,000 clients per node: elock 95.6 thousand, mnesia 21.7 thousand, global 1.3 thousand. At 100,000 clients per node: elock 307 thousand, mnesia 15.8 thousand; global was not run">
