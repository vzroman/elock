<svg xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-label="Two panels. At start, both nodes run a copy of PLC connection A and each asks for an exclusive lock A on every node; node 1's copy holds it and works, node 2's copy waits inside its request, holding nothing. When node 1 goes down, its locks are released, the waiting request on node 2 is granted and that copy continues the work">
<rect width="760" height="544" fill="#fcfcfb"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Ownership by lock: every node starts the service, the lock decides which copy works</text>
<text x="24" y="58" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">1. At start: both copies ask for lock A, exclusive, on every node. One gets it.</text>
<rect x="24" y="68" width="344" height="200" rx="6" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="36" y="88" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">node 1</text>
<rect x="392" y="68" width="344" height="200" rx="6" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="404" y="88" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">node 2</text>
<rect x="36" y="104" width="196" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="134.0" y="122" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">PLC connection A</text>
<text x="134.0" y="138" font-size="11" fill="#52514e" text-anchor="middle">holds lock A, works</text>
<line x1="134" y1="148" x2="134" y2="206" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="142" y="166" font-size="11" fill="#52514e" text-anchor="start">lock A: exclusive,</text>
<text x="142" y="180" font-size="11" fill="#52514e" text-anchor="start">on every node, once</text>
<rect x="36" y="208" width="320" height="40" rx="4" fill="#f0efec"/>
<text x="38" y="261" font-size="11" fill="#52514e" text-anchor="start">locks on node 1</text>
<rect x="120" y="217" width="28" height="22" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="134" y="232" font-size="11" fill="#0b0b0b" text-anchor="middle">A</text>
<line x1="232" y1="126" x2="434" y2="206" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<rect x="500" y="104" width="220" height="44" rx="4" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="610.0" y="122" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">PLC connection A</text>
<text x="610.0" y="138" font-size="11" fill="#52514e" text-anchor="middle">standby: waits inside the request</text>
<line x1="610" y1="148" x2="610" y2="206" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow-grey)" stroke-dasharray="5 4"/>
<text x="602" y="166" font-size="11" fill="#52514e" text-anchor="end">asks for lock A,</text>
<text x="602" y="180" font-size="11" fill="#52514e" text-anchor="end">on every node: queued,</text>
<text x="602" y="194" font-size="11" fill="#52514e" text-anchor="end">holds nothing</text>
<rect x="404" y="208" width="320" height="40" rx="4" fill="#f0efec"/>
<text x="406" y="261" font-size="11" fill="#52514e" text-anchor="start">locks on node 2</text>
<rect x="420" y="217" width="28" height="22" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="434" y="232" font-size="11" fill="#0b0b0b" text-anchor="middle">A</text>
<text x="456" y="232" font-size="11" fill="#52514e" text-anchor="start">held by node 1's copy</text>
<rect x="596" y="217" width="28" height="22" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="610" y="232" font-size="11" fill="#0b0b0b" text-anchor="middle">A</text>
<text x="24" y="300" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">2. Node 1 goes down: its locks are released, the standby's request is granted, the work continues.</text>
<rect x="24" y="310" width="344" height="200" rx="6" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="6 4"/>
<text x="36" y="330" font-size="12" fill="#52514e" text-anchor="start" font-weight="600">node 1, down</text>
<rect x="392" y="310" width="344" height="200" rx="6" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="404" y="330" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">node 2</text>
<rect x="36" y="346" width="196" height="44" rx="4" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="134.0" y="364" font-size="12" fill="#52514e" text-anchor="middle" font-weight="600">PLC connection A</text>
<text x="134.0" y="380" font-size="11" fill="#52514e" text-anchor="middle">gone with the node</text>
<rect x="36" y="450" width="320" height="40" rx="4" fill="#f0efec"/>
<text x="38" y="503" font-size="11" fill="#52514e" text-anchor="start">locks on node 1</text>
<text x="56" y="474" font-size="11" fill="#52514e" text-anchor="start">lock A released</text>
<rect x="500" y="346" width="220" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="610.0" y="364" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">PLC connection A</text>
<text x="610.0" y="380" font-size="11" fill="#52514e" text-anchor="middle">holds lock A, works</text>
<line x1="610" y1="390" x2="610" y2="448" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="602" y="408" font-size="11" fill="#52514e" text-anchor="end">the waiting request</text>
<text x="602" y="422" font-size="11" fill="#52514e" text-anchor="end">is granted; on error</text>
<text x="602" y="436" font-size="11" fill="#52514e" text-anchor="end">re-read the nodes, ask again</text>
<rect x="404" y="450" width="320" height="40" rx="4" fill="#f0efec"/>
<text x="406" y="503" font-size="11" fill="#52514e" text-anchor="start">locks on node 2</text>
<rect x="596" y="459" width="28" height="22" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="610" y="474" font-size="11" fill="#0b0b0b" text-anchor="middle">A</text>
<rect x="36" y="522" width="16" height="12" rx="2" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="58" y="532" font-size="11" fill="#52514e" text-anchor="start">exclusive lock, held</text>
<rect x="190" y="522" width="16" height="12" rx="2" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="212" y="532" font-size="11" fill="#52514e" text-anchor="start">exclusive lock, queued</text>
<line x1="360" y1="528" x2="378" y2="528" stroke="#eb6834" stroke-width="1.5"/>
<text x="384" y="532" font-size="11" fill="#52514e" text-anchor="start">crosses the link</text>
</svg>
