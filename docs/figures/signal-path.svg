<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-label="A PLC connection reads three device addresses and writes tag1, tag2 and tag3. An IoT connection reads three addresses and writes tag4, tag5 and tag6. A calculation or user script subscribes to tag2, tag3 and tag4 and writes tag7, tag8 and tag9. The archive and the alarm service subscribe to tag9. Many more connections and calculations exist. Below them, occasional writers, user sessions, state estimation, the grid graph and AI agents, read any tag and write any tag, rarely">
<rect width="760" height="390" fill="#fcfcfb"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Signal propagation: each heavy writer owns its tags, occasional writers touch any</text>
<text x="24" y="66" font-size="11" fill="#898781" text-anchor="start">device</text>
<text x="120" y="66" font-size="11" fill="#898781" text-anchor="start">connection</text>
<text x="300" y="66" font-size="11" fill="#898781" text-anchor="start">tags</text>
<text x="390" y="66" font-size="11" fill="#898781" text-anchor="start">calculation</text>
<text x="594" y="66" font-size="11" fill="#898781" text-anchor="start">tags</text>
<text x="666" y="66" font-size="11" fill="#898781" text-anchor="start">consumers</text>

<!-- PLC group -->
