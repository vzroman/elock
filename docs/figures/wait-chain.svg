<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-label="Two rows of three processes. In the first, P1 holds a and waits for b, P2 holds b and waits for c, and P3 holds c and works: a chain. In the second, P3 also waits for a, closing the chain into a deadlock in which nobody works">
<rect width="760" height="262" fill="#fcfcfb"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Holding while waiting: a chain, and the chain closed into a deadlock</text>
<text x="40" y="62" font-size="12" fill="#52514e" text-anchor="start">A chain: P3 works, P1 and P2 wait, and what they hold waits with them</text>
<rect x="60" y="74" width="110" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="115.0" y="92" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">P1</text>
<text x="115.0" y="108" font-size="11" fill="#52514e" text-anchor="middle">holds a</text>
<rect x="280" y="74" width="110" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="335.0" y="92" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">P2</text>
<text x="335.0" y="108" font-size="11" fill="#52514e" text-anchor="middle">holds b</text>
<rect x="500" y="74" width="110" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="555.0" y="92" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">P3</text>
<text x="555.0" y="108" font-size="11" fill="#52514e" text-anchor="middle">holds c, working</text>
<line x1="170.0" y1="96.0" x2="276.0" y2="96.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="223.0" y="88.0" font-size="11" fill="#52514e" text-anchor="middle">waits for b</text>
<line x1="390.0" y1="96.0" x2="496.0" y2="96.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="443.0" y="88.0" font-size="11" fill="#52514e" text-anchor="middle">waits for c</text>
<text x="40" y="154" font-size="12" fill="#52514e" text-anchor="start">Closed: P3 waits for a. Nobody works until a verdict is made and the loser starts over</text>
<rect x="60" y="166" width="110" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="115.0" y="184" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">P1</text>
<text x="115.0" y="200" font-size="11" fill="#52514e" text-anchor="middle">holds a</text>
<rect x="280" y="166" width="110" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="335.0" y="184" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">P2</text>
<text x="335.0" y="200" font-size="11" fill="#52514e" text-anchor="middle">holds b</text>
<rect x="500" y="166" width="110" height="44" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.2"/>
<text x="555.0" y="184" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">P3</text>
<text x="555.0" y="200" font-size="11" fill="#52514e" text-anchor="middle">holds c</text>
<line x1="170.0" y1="188.0" x2="276.0" y2="188.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="223.0" y="180.0" font-size="11" fill="#52514e" text-anchor="middle">waits for b</text>
<line x1="390.0" y1="188.0" x2="496.0" y2="188.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="443.0" y="180.0" font-size="11" fill="#52514e" text-anchor="middle">waits for c</text>
<path d="M555.0,210 L555.0,236 L115.0,236 L115.0,216" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="335.0" y="230" font-size="11" fill="#52514e" text-anchor="middle">waits for a</text>
</svg>
